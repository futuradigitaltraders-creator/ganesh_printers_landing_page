<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTURA — Desktop Wide Catalogue Preview (Approval Only)</title>
<style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#18072a}.banner{position:sticky;top:0;z-index:9999;background:#ffe48b;color:#31135a;padding:9px 16px;font-weight:bold;text-align:center;font-size:14px}.banner span{font-weight:normal}.frame{width:100%;height:calc(100vh - 41px);border:0;display:block}</style></head>
<body><div class="banner">DESKTOP WIDE TEST PREVIEW ONLY <span>— No changes to the live catalogue. Do not place an order from this preview.</span></div>
<iframe id="preview" class="frame" title="Desktop wide preview" src="deepavali-crackers-2026.html?catalogue=quality#quality-price-list"></iframe>
<script>
const iframe=document.getElementById('preview');
iframe.addEventListener('load',()=>{
 try{
  const doc=iframe.contentDocument;
  if(!doc||doc.getElementById('futura-wide-desktop-test'))return;
  const style=doc.createElement('style');style.id='futura-wide-desktop-test';
  style.textContent=`@media(min-width:1024px){
  main{max-width:calc(100% - 60px)!important;width:calc(100% - 60px)!important;padding-left:0!important;padding-right:0!important}
  .sample-shop{padding:clamp(14px,1.4vw,22px)!important}
  .product-row{grid-template-columns:60px 115px minmax(250px,1fr) 170px 130px 145px!important}
  .product-row>div{padding:12px!important}
  .live-summary .sum-box{min-height:88px!important;padding:12px!important}
  }`;
  doc.head.appendChild(style);
 }catch(err){document.querySelector('.banner span').textContent='Preview could not load: '+err.message}
});
</script></body></html>
