<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>14×24 Die-Cutting Calendar – Design</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,sans-serif;background:#10045a}
body{overflow-x:hidden}
.page{min-height:100vh;padding:24px 18px 45px;background:#10045a url('images/Die%20Cutting%20Calendars/CATELOGUE%2003/DIE%20%20CUT%20BG.jpg') center/cover fixed no-repeat}
.wrap{max-width:1180px;margin:auto}
.nav-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.nav-btn{display:inline-block;background:#222;color:#fff;text-decoration:none;padding:9px 14px;border-radius:6px;font-size:13px;font-weight:700;border:0;cursor:pointer}
.next-btn{background:#000}
.next-btn:disabled{opacity:.45;cursor:not-allowed}
.product{background:#fff;border-radius:12px;box-shadow:0 5px 24px #0007;padding:18px;text-align:center}
.viewer{width:100%;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;border-radius:8px;background:#f5f5f5}
.viewer img{display:block;width:auto;height:auto;max-width:100%;max-height:none;user-select:none;-webkit-user-drag:none}
@media(max-width:500px){.page{padding:18px 12px 40px}.nav-btn{font-size:12px;padding:8px 10px}}
</style>
</head>
<body>
<main class="page"><div class="wrap">
<div class="nav-row">
<a class="nav-btn" href="die-cutting-catalogue-01l-14x24.html">← Back to Designs</a>
<button class="nav-btn next-btn" id="nextDesignBtn" type="button">NEXT DESIGN →</button>
</div>
<section class="product">
<div class="viewer"><img id="productImage" src="" alt="14×24 Die-Cutting Calendar Design"></div>
</section>
</div></main>
<script>
const base='images/Die%20Cutting%20Calendars/CATELAGUE%20-%2001L/14x24/';
const designs=[
['200','0001.jpg'],['201','0002%20A.jpg'],['202','0002.jpg'],['203','0003.jpg'],['204','0004.jpg'],['205','0005.jpg'],['206','0006.jpg'],['207','0007.jpg'],['208','0008.jpg'],['209','0009.jpg'],['210','0010.jpg'],['211','0011.jpg'],['212','0012.jpg'],['213','0013.jpg'],['214','0014.jpg'],['215','0015.jpg'],['216','0016.jpg'],['217','0017.jpg'],['218','0018.jpg']
];
const img=document.getElementById('productImage');
const next=document.getElementById('nextDesignBtn');
let currentIndex=0;
function showDesign(i){
  currentIndex=Math.max(0,Math.min(designs.length-1,i));
  const d=designs[currentIndex];
  img.src=base+d[1];
  img.alt='14×24 Die-Cutting Calendar Design No. '+d[0];
  next.disabled=currentIndex>=designs.length-1;
}
const requested=new URLSearchParams(location.search).get('design');
const requestedIndex=designs.findIndex(d=>d[0]===requested);
showDesign(requestedIndex>=0?requestedIndex:0);
next.onclick=()=>{if(currentIndex<designs.length-1)showDesign(currentIndex+1)};
</script>
</body>
</html>
