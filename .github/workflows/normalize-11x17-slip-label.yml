name: Normalize 11x17 Slip Label
on:
  workflow_run:
    workflows: ["Update 11x17 Catalogue"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change inner slip selector text
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('die-cutting-product-test-11x17.html')
          s=p.read_text(encoding='utf-8')
          replacements={
              '<label for="specialDesign">Design Number</label>':'<label for="specialDesign">Slip Number</label>',
              '<option value="">Select Design Number</option>':'<option value="">Select Slip Number</option>'
          }
          changed=False
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new,1)
                  changed=True
          if changed:
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit slip selector text
        run: |
          git config user.name 'futuradigitaltraders-creator'
          git config user.email 'futuradigitaltraders@gmail.com'
          git add die-cutting-product-test-11x17.html
          git diff --cached --quiet || git commit -m 'Set slip selector text [skip ci]'
          git push
