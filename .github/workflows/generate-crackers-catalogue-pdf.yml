name: Generate Crackers Image Catalogue PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-crackers-catalogue-pdf.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated catalogue PDF
        run: |
          curl -L --fail --retry 3 --retry-delay 5 --max-time 180 \
            "https://www.futuraonlineprint.in/api/crackers-images-pdf" \
            -o "FUTURA_Deepavali_Crackers_2026_Image_Catalogue.pdf"
          test -s "FUTURA_Deepavali_Crackers_2026_Image_Catalogue.pdf"
          ls -lh "FUTURA_Deepavali_Crackers_2026_Image_Catalogue.pdf"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: FUTURA-crackers-image-catalogue
          path: FUTURA_Deepavali_Crackers_2026_Image_Catalogue.pdf
          compression-level: 0
          retention-days: 7

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "FUTURA_Deepavali_Crackers_2026_Image_Catalogue.pdf"
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Generate crackers image catalogue PDF [skip ci]"
            git push
          fi
