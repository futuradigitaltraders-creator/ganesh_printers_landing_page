name: Remove 11x17 Duplicate Page
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-duplicate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate page 205
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('die-cutting-product-test-11x17.html')
          s=p.read_text(encoding='utf-8')
          target="  {id:'205',file:'5_s 11x17 Fancy Foil Cutting Calendar.jpg',range:'DESIGN No.: PANCHANGAM & DAILY CALENDAR SLIP No.100',items:['PANCHANGAM & DAILY CALENDAR SLIP No.100']},\n"
          if target not in s:
              raise SystemExit('Duplicate page 205 block not found')
          s=s.replace(target,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'futuradigitaltraders-creator'
          git config user.email 'futuradigitaltraders@gmail.com'
          git add die-cutting-product-test-11x17.html
          git commit -m 'Remove duplicate 11x17 page 205 [skip ci]'
          git push
