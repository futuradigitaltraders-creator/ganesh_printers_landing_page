name: Update 11x17 Catalogue
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock special order controls
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('die-cutting-product-test-11x17.html')
          s=p.read_text(encoding='utf-8')
          old="requiredQty.value=safeRead(REQUIRED_KEY,'0')||'0';const first=pg.items[0];qty.value=String(c[first]?.qty||0);"
          new="const special=pg.id==='204'||pg.id==='206';const reqOpts=special?['0','100','200','300','400','500']:['0','100','200','300','400','500','600','700','800','900','1000'];const qtyOpts=special?['0','100','200','300','400','500']:['0','10','20','25','50','100'];requiredQty.innerHTML=reqOpts.map(v=>`<option value=\\\"${v}\\\">${v==='0'?'Select Total Required Quantity':v}</option>`).join('');qty.innerHTML=qtyOpts.map(v=>`<option value=\\\"${v}\\\">${v==='0'?'Select Quantity':v}</option>`).join('');requiredQty.value=safeRead(REQUIRED_KEY,'0')||'0';const first=pg.items[0];qty.value=String(c[first]?.qty||0);"
          if old in s:
              s=s.replace(old,new,1)
          old2="function configureSpecialControls(){const pg=pages[currentIndex],isCalendar=pg?.id==='204',isSlip=pg?.id==='206',show=!!(isCalendar||isSlip);specialControls.style.display=show?'block':'none';"
          new2="function configureSpecialControls(){const pg=pages[currentIndex],isCalendar=pg?.id==='204',isSlip=pg?.id==='206',show=!!(isCalendar||isSlip);document.getElementById('moqBox').style.display=show?'none':'block';specialControls.style.display=show?'block':'none';"
          if old2 in s:
              s=s.replace(old2,new2,1)
          s=s.replace('<label for="specialDesign">Design Number</label>','<label for="specialDesign">Slip Number</label>')
          s=s.replace('<option value="">Select Design Number</option>','<option value="">Select Slip Number</option>')
          s=s.replace('<label for="specialColour">Colour</label>','<label for="specialColour">Slip Colour</label>')
          s=s.replace('<option value="">Select Colour</option>','<option value="">Select Slip Colour</option>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'futuradigitaltraders-creator'
          git config user.email 'futuradigitaltraders@gmail.com'
          git add die-cutting-product-test-11x17.html
          git diff --cached --quiet || git commit -m 'Apply special MOQ and slip labels [skip ci]'
          git push
