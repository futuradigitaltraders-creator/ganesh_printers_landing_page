name: Update 11x17 Catalogue
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch 11x17 product page
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('die-cutting-product-test-11x17.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="design-range">DESIGN No.: 1158-F, 1159-F, 1161-F, 1162-F, 1163-F, 1164-F</div>','<div class="design-range" id="designRange"></div>')
          s=s.replace('<div class="moq">MINIMUM ORDER QUANTITY (MOQ): 100</div>','<div class="moq" id="moqBox">MINIMUM ORDER QUANTITY (MOQ): <span id="moqValue">100</span></div><div class="special-controls" id="specialControls"><div class="special-control"><label for="specialDesign">Design Number</label><select class="select" id="specialDesign"><option value="">Select Design Number</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>10</option><option>15</option></select></div><div class="special-control"><label for="specialColour">Colour</label><select class="select" id="specialColour"><option value="">Select Colour</option><option>1 Colour</option><option>2 Colours</option><option>Multi Colours</option></select></div></div>')
          script='''<script>
          const base='images/Die%20Cutting%20Calendars/CATELAGUE%20-%2001L/11x17/';
          const pages=[
            {id:'200',file:'1_s 11x17 Fancy Foil Cutting Calendar.jpg',range:'DESIGN No.: 1158-F, 1159-F, 1161-F, 1162-F, 1163-F, 1164-F',items:['1158-F','1159-F','1161-F','1162-F','1163-F','1164-F']},
            {id:'201',file:'2_s 11x17 Fancy Foil Cutting Calendar.jpg',range:'DESIGN No.: 1166-F, 1167-F, 1168-F, 1170-F, 1171-F, 1172-F',items:['1166-F','1167-F','1168-F','1170-F','1171-F','1172-F']},
            {id:'202',file:'3_s 11x17 Fancy Foil Cutting Calendar.jpg',range:'DESIGN No.: 1173-F, 1175-F, 1176-F, 1177-F, 1179-F, 1180-F',items:['1173-F','1175-F','1176-F','1177-F','1179-F','1180-F']},
            {id:'203',file:'4_s 11x17 Fancy Foil Cutting Calendar.jpg',range:'DESIGN No.: 1181-F, 1182-F, 1183-F, 1184-F, 1185-F',items:['1181-F','1182-F','1183-F','1184-F','1185-F']},
            {id:'204',file:'5_s 11x17 Fancy Foil Cutting Calendar.jpg',range:'DESIGN No.: 10×15 & 11×17 DAILY CALENDAR WITH MONTHLY CALENDAR',items:['10×15 & 11×17 DAILY CALENDAR WITH MONTHLY CALENDAR']},
            {id:'205',file:'5_s 11x17 Fancy Foil Cutting Calendar.jpg',range:'DESIGN No.: PANCHANGAM & DAILY CALENDAR SLIP No.100',items:['PANCHANGAM & DAILY CALENDAR SLIP No.100']},
            {id:'206',file:'6 SLIPS.jpg',range:'DESIGN No.: DAILY SLIP No.1, 2, 3, 4, 5, 6, 7, 10, 15 (1 colour, 2 colours, multi colours)',items:['DAILY SLIP No.1, 2, 3, 4, 5, 6, 7, 10, 15 (1 colour, 2 colours, multi colours)'],dailySlip:true,moq:500}
          ];
          const CART_KEY='dieCuttingCalendarCartV2',REQUIRED_KEY='dieCuttingRequiredQtyV2';let currentIndex=0;
          const img=document.getElementById('productImage'),overlay=document.getElementById('overlay'),stage=document.getElementById('stage'),zoomImg=document.getElementById('zoomImage'),zoomLevel=document.getElementById('zoomLevel'),designRows=document.getElementById('designRows'),designRange=document.getElementById('designRange'),specialControls=document.getElementById('specialControls'),specialDesign=document.getElementById('specialDesign'),specialColour=document.getElementById('specialColour'),moqValue=document.getElementById('moqValue');
          let scale=1,x=0,y=0,dragging=false,startX=0,startY=0,baseX=0,baseY=0;
          function safeRead(k,f){try{return localStorage.getItem(k)??f}catch(e){return f}};function safeWrite(k,v){try{localStorage.setItem(k,v);return true}catch(e){alert('Browser storage is blocked. Please allow site storage and try again.');return false}};
          function readCart(){try{return JSON.parse(localStorage.getItem(CART_KEY)||'{}')}catch(e){return{}}};function writeCart(c){return safeWrite(CART_KEY,JSON.stringify(c))};function totalOrder(){return Object.values(readCart()).reduce((s,i)=>s+Number(i.qty||0),0)};
          function renderZoom(){zoomImg.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`;zoomLevel.textContent=`Zoom: ${Math.round(scale*100)}% · ${scale>1?'Hand drag enabled':'Normal view'}`;stage.style.cursor=scale>1?'grab':'default'}
          function openZoom(){scale=1;x=0;y=0;zoomImg.src=img.src;overlay.classList.add('show');document.body.style.overflow='hidden';renderZoom()}function openZoomAt(v){openZoom();setZoom(v)}function setZoom(v){scale=Math.max(.6,Math.min(3,v));if(scale<=1){x=0;y=0}renderZoom()}function resetView(){scale=1;x=0;y=0;overlay.classList.remove('show');document.body.style.overflow='';zoomLevel.textContent='Zoom: 100% · Click image to open full viewer'}
          img.onclick=openZoom;document.getElementById('close').onclick=resetView;overlay.onclick=e=>{if(e.target===overlay)resetView()};stage.addEventListener('pointerdown',e=>{if(scale<=1)return;dragging=true;stage.classList.add('dragging');startX=e.clientX;startY=e.clientY;baseX=x;baseY=y;stage.setPointerCapture(e.pointerId);e.preventDefault()});stage.addEventListener('pointermove',e=>{if(!dragging)return;x=baseX+e.clientX-startX;y=baseY+e.clientY-startY;renderZoom()});['pointerup','pointercancel'].forEach(ev=>stage.addEventListener(ev,()=>{dragging=false;stage.classList.remove('dragging')}));stage.addEventListener('wheel',e=>{e.preventDefault();setZoom(scale+(e.deltaY<0?.1:-.1))},{passive:false});
          const requiredQty=document.getElementById('requiredQty'),qty=document.getElementById('qty'),designQty=document.getElementById('designQty'),subTotal=document.getElementById('subTotal'),totalQty=document.getElementById('totalQty'),balanceQty=document.getElementById('balanceQty'),balanceBox=document.getElementById('balanceBox'),totalBox=document.getElementById('totalBox'),cartBtn=document.getElementById('cartBtn'),waBtn=document.getElementById('waBtn'),nextBtn=document.getElementById('nextDesignBtn');
          function qopts(v){return ['0','10','20','25','50','100'].map(n=>`<option value="${n}" ${String(v)===n?'selected':''}>${n==='0'?'Select':n}</option>`).join('')}
          function renderRows(){const c=readCart(),pg=pages[currentIndex];designRows.innerHTML=pg.items.map((label,i)=>{const q=Number(c[label]?.qty||0);return `<div class="design-row ${i===0?'current':''}"><span class="design-name">Design No. ${label}</span><select class="design-select" data-label="${encodeURIComponent(label)}">${qopts(q)}</select></div>`}).join('');designRows.querySelectorAll('.design-select').forEach(sel=>sel.addEventListener('change',()=>{const label=decodeURIComponent(sel.dataset.label),n=Number(sel.value),target=Number(requiredQty.value),c=readCart(),other=totalOrder()-Number(c[label]?.qty||0);if(n>0&&target&&other+n>target){alert('BALANCE / SELECT: '+Math.max(0,target-other));refresh();return}if(n===0)delete c[label];else c[label]={qty:n};writeCart(c);refresh()}))}
          function refresh(){const pg=pages[currentIndex],c=readCart(),pageTotal=pg.items.reduce((s,label)=>s+Number(c[label]?.qty||0),0),t=totalOrder(),target=Number(safeRead(REQUIRED_KEY,'0')||0),balance=Math.max(0,target-t),ready=target>0&&t>=target;designRange.textContent=pg.range;moqValue.textContent=String(pg.moq||100);specialControls.style.display=pg.dailySlip?'grid':'none';if(pg.dailySlip){specialDesign.value=safeRead('dieCuttingDailySlipDesignV1','');specialColour.value=safeRead('dieCuttingDailySlipColourV1','')}else{specialDesign.value='';specialColour.value=''}requiredQty.disabled=false;qty.disabled=false;requiredQty.value=safeRead(REQUIRED_KEY,'0')||'0';const first=pg.items[0];qty.value=String(c[first]?.qty||0);designQty.textContent=String(pageTotal);subTotal.textContent=String(pageTotal);totalQty.textContent=String(t);balanceQty.textContent=String(balance);balanceBox.classList.toggle('complete',ready);totalBox.classList.toggle('reached',ready);cartBtn.classList.toggle('ready',ready);waBtn.classList.toggle('ready',ready);cartBtn.textContent=ready?'✓ ADD TO CART':'🛒 ADD TO CART';renderRows()}
          function showPage(i){currentIndex=Math.max(0,Math.min(pages.length-1,i));const pg=pages[currentIndex];img.src=base+encodeURIComponent(pg.file);img.alt=pg.range;resetView();nextBtn.disabled=currentIndex>=pages.length-1;refresh()}
          requiredQty.addEventListener('change',()=>{const old=Number(safeRead(REQUIRED_KEY,'0')||0),n=Number(requiredQty.value),t=totalOrder();if(n&&t>n){alert('Existing total order quantity '+t+' is already above the selected required quantity.');requiredQty.value=old||0;refresh();return}safeWrite(REQUIRED_KEY,requiredQty.value);qty.disabled=false;refresh()});
          qty.addEventListener('change',()=>{const n=Number(qty.value),target=Number(requiredQty.value),pg=pages[currentIndex],label=pg.items[0],c=readCart(),other=totalOrder()-Number(c[label]?.qty||0);if(n>0&&target&&other+n>target){alert('BALANCE / SELECT: '+Math.max(0,target-other));refresh();return}if(n===0)delete c[label];else c[label]={qty:n};writeCart(c);refresh()});
          specialDesign.addEventListener('change',()=>{safeWrite('dieCuttingDailySlipDesignV1',specialDesign.value);refresh()});
          specialColour.addEventListener('change',()=>{safeWrite('dieCuttingDailySlipColourV1',specialColour.value);refresh()});
          cartBtn.addEventListener('click',()=>{const target=Number(requiredQty.value),t=totalOrder();if(!target){alert('Please select TOTAL REQUIRED QUANTITY first.');return}if(t<target){alert('Please complete TOTAL ORDER QUANTITY. Balance: '+(target-t));return}alert('Added to cart. TOTAL ORDER QUANTITY: '+t)});
          waBtn.addEventListener('click',()=>{const target=Number(requiredQty.value),t=totalOrder();if(!target){alert('Please select TOTAL REQUIRED QUANTITY first.');return}if(t<target){alert('Please complete TOTAL ORDER QUANTITY. Balance: '+(target-t));return}const items=Object.entries(readCart()).map(([label,v])=>'Design '+label+' Qty '+Number(v.qty||0)).join(' | ');const extra=pages[currentIndex].dailySlip?` | Design Number ${specialDesign.value||'Not selected'} | Colour ${specialColour.value||'Not selected'}`:'';const text='Die-Cutting Calendar Order%0ASize: 11x17%0A'+encodeURIComponent(items+extra+'%0ATotal Order Quantity: '+t);window.open('https://wa.me/?text='+text,'_blank')});
          nextBtn.addEventListener('click',()=>{if(currentIndex<pages.length-1)showPage(currentIndex+1)});
          const requested=new URLSearchParams(window.location.search).get('design'),idx=pages.findIndex(p=>p.id===String(requested));showPage(idx>=0?idx:0);
          </script>'''
          s=s.replace('<style>','<style>.special-controls{display:none;grid-template-columns:1fr 1fr;gap:10px;margin:-4px 0 14px}.special-control label{display:block;font-size:14px;color:#111b67;font-weight:800;margin:0 0 6px}.special-control .select{padding:10px}@media(max-width:500px){.special-controls{grid-template-columns:1fr}}</style>\n<style>',1)
          s=re.sub(r'<script>[\s\S]*?</script>\s*</body>',script+'\n</body>',s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'futuradigitaltraders-creator'
          git config user.email 'futuradigitaltraders@gmail.com'
          git add die-cutting-product-test-11x17.html .github/workflows/update-11x17-catalogue.yml
          git diff --cached --quiet || git commit -m 'Add daily slip controls and MOQ 500 [skip ci]'
          git push
