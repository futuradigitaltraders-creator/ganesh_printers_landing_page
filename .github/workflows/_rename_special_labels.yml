name: Rename Special Slip Labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename slip labels
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('die-cutting-product-test-11x17.html')
          s=p.read_text(encoding='utf-8')
          replacements = {
              '<label for="specialDesign">Design Number</label>':'<label for="specialDesign">Slip Number</label>',
              '<option value="">Select Design Number</option>':'<option value="">Select Slip Number</option>',
              '<label for="specialColour">Colour</label>':'<label for="specialColour">Slip Colour</label>',
              '<option value="">Select Colour</option>':'<option value="">Select Slip Colour</option>',
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit label change
        run: |
          git config user.name 'futuradigitaltraders-creator'
          git config user.email 'futuradigitaltraders@gmail.com'
          git add die-cutting-product-test-11x17.html
          git diff --cached --quiet || git commit -m 'Rename slip selector labels [skip ci]'
          git push
