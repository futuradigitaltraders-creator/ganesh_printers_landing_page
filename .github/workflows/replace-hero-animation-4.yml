name: Replace Hero Animation 4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace animation image 4
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'images/animation/4 animation scroll new.jpg'
          new = 'images/MOUNT%20CALENDARS/3%20PARTY%20DESIGN/1%20vijay.jpeg'
          if old not in s:
              raise SystemExit('Target animation image 4 was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit homepage change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/replace-hero-animation-4.yml
          git commit -m "Replace hero animation image 4 with 1 vijay"
          git push
