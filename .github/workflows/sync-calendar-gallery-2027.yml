name: Sync 2027 Calendar Gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'images/2026 CHRISTIAN CALENDARS/**'
      - 'images/2026 YANAI CALENDARS/**'
      - 'images/2026 GEEETHA LAMINATION/**'
      - 'images/SHREE PRINTOGRAPHY CALENDARS/**'

permissions:
  contents: write

concurrency:
  group: calendar-gallery-index-main
  cancel-in-progress: false

jobs:
  refresh-gallery-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Regenerate gallery manifest
        run: node scripts/generate-calendar-gallery-2027.mjs
      - name: Commit updated gallery index only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/calendar-gallery-2027.json
          if git diff --cached --quiet; then
            echo "Gallery already matches uploaded images"
          else
            git commit -m "Update 2027 calendar gallery index"
            git push
          fi
