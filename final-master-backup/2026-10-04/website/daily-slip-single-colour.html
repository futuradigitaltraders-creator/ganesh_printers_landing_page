<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daily Slip | Single Colour | Futura Traders</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#10045a;color:#fff;font-family:Arial,sans-serif}.page{min-height:100vh;padding:32px 18px 55px;background:#10045a url('images/Die%20Cutting%20Calendars/CATELOGUE%2003/DIE%20%20CUT%20BG.jpg') center/cover fixed no-repeat}.wrap{max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.btn{background:#222;color:#fff;text-decoration:none;padding:9px 15px;border-radius:6px;font-weight:700;font-size:14px}.title{text-align:center;color:#ffe36b;font:700 clamp(32px,4.5vw,62px) Georgia,serif;text-shadow:2px 3px 0 #7b1b00,0 5px 12px #000;margin:0}.sub{text-align:center;font:700 clamp(20px,2.5vw,32px) Georgia,serif;margin:10px 0 30px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.card{background:#fff;border:3px solid #d89b13;border-radius:14px;padding:9px}.card img{display:block;width:100%;height:auto;border-radius:9px}.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:3px solid #d89b13;border-radius:14px;background:rgba(0,0,0,.25);color:#ffe36b;font-weight:700;font-size:20px}@media(max-width:900px){.gallery{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.gallery{grid-template-columns:1fr}.top{gap:8px;flex-wrap:wrap}}
</style></head><body><main class="page"><div class="wrap"><div class="top"><a class="btn" href="die-cutting-catalogue-01l-10x15.html">← Back: Daily Slip</a><a class="btn" href="daily-slip-2-colours-multi.html">2 COLOURS &amp; MULTI →</a></div><h1 class="title">DAILY SLIP</h1><div class="sub">SINGLE COLOUR</div><section id="gallery" class="gallery"></section></div></main><script>
const api='https://api.github.com/repos/futuradigitaltraders-creator/ganesh_printers_landing_page/contents/images/gold-frame-special-daily-calendar/Daily%20Slip/1%20Colour?ref=main';
fetch(api).then(r=>r.json()).then(files=>{const g=document.getElementById('gallery');const imgs=Array.isArray(files)?files.filter(f=>f.type==='file'&&/\.(jpe?g|png|webp)$/i.test(f.name)):[];if(!imgs.length){g.innerHTML='<div class="empty">SINGLE COLOUR DAILY SLIP DESIGNS WILL BE ADDED HERE</div>';return;}imgs.forEach(f=>{const c=document.createElement('div');c.className='card';const i=document.createElement('img');i.src=f.download_url;i.alt='Single Colour Daily Slip';i.loading='lazy';c.appendChild(i);g.appendChild(c)})}).catch(()=>{document.getElementById('gallery').innerHTML='<div class="empty">SINGLE COLOUR DAILY SLIP DESIGNS WILL BE ADDED HERE</div>'});
</script></body></html>
