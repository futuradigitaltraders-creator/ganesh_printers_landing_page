<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daily Slips & Panchangam | Futura Traders</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;background:#10045a}
.catalogue-page{min-height:100vh;background:#10045a url('images/MOUNT%20CALENDARS/enlarge%20bg%20new.jpg') center/cover fixed no-repeat;color:#fff}
.wrap{width:100%;min-height:100vh;padding:45px 3% 60px;text-align:center}
.back{display:inline-block;color:#fff;text-decoration:none;font:700 14px Arial;background:#222;padding:9px 15px;border-radius:6px;margin-bottom:25px}
.title{margin:0 0 30px;color:#ffe36b;font:700 clamp(30px,4vw,55px) Georgia,serif;text-shadow:2px 3px 0 #7b1b00,0 5px 12px #000}
.gallery{width:100%;max-width:1600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.card{background:#fff;padding:8px;border:3px solid #e4aa18;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.45);overflow:hidden}
.card img{display:block;width:100%;height:auto;border-radius:7px}
.empty{grid-column:1/-1;min-height:220px;border:3px solid #e4aa18;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 18px Arial;color:#ffe36b;background:rgba(0,0,0,.18)}
@media(max-width:1000px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wrap{padding:30px 2% 45px}}
@media(max-width:430px){.gallery{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="catalogue-page">
<div class="wrap">
<a class="back" href="calendar.html">← Back to 2027 Calendars</a>
<h1 class="title">DAILY SLIPS &amp; PANCHANGAM</h1>
<div id="gallery" class="gallery" aria-label="Daily Slips and Panchangam samples"></div>
</div>
</main>
<script>
const api='https://api.github.com/repos/futuradigitaltraders-creator/ganesh_printers_landing_page/contents/images/DAILY%20SLIP/MOUNT%20CALENDAR?ref=main';
fetch(api).then(r=>r.json()).then(files=>{
  const gallery=document.getElementById('gallery');
  const images=files.filter(f=>f.type==='file' && /\.(jpe?g|png|webp)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
  if(!images.length){gallery.innerHTML='<div class="empty">DAILY SLIPS &amp; PANCHANGAM IMAGES WILL BE ADDED HERE</div>';return;}
  images.forEach((f,i)=>{
    const card=document.createElement('div'),img=document.createElement('img');
    card.className='card';
    img.src=f.download_url;
    img.alt='Daily Slips & Panchangam Sample '+(i+1);
    img.loading='lazy';
    card.appendChild(img);gallery.appendChild(card);
  });
}).catch(()=>{
  document.getElementById('gallery').innerHTML='<div class="empty">DAILY SLIPS &amp; PANCHANGAM IMAGES WILL BE ADDED HERE</div>';
});
</script>
</body>
</html>
