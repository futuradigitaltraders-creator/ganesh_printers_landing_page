<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2027 Calendars & Diary | Ganesh Printers</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#222}.header{background:linear-gradient(90deg,#a90000,#d39b00);color:#fff;text-align:center;padding:18px 12px}.header h1{font-size:28px;margin-bottom:5px}.header p{font-size:12px}.container{max-width:1200px;margin:25px auto;padding:0 15px}.back{text-align:center;margin-bottom:15px}.back a{display:inline-block;background:#222;color:#fff;padding:7px 12px;border-radius:4px;text-decoration:none;font-size:11px}.loading,.error{text-align:center;padding:30px;color:#666}.category{margin:28px 0 12px;padding:9px 12px;background:#222;color:#fff;border-radius:5px;font-size:18px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{background:#fff;border-radius:7px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12)}.product img{width:100%;height:auto;display:block;cursor:pointer}.product-content{padding:9px;text-align:center}.product-number{font-size:10px;color:#888;margin-bottom:3px}.product h3{font-size:13px;margin-bottom:5px;line-height:1.25}.dimension{font-size:10px;color:#777;margin-bottom:7px}.btn{display:inline-block;padding:7px 9px;border-radius:4px;text-decoration:none;font-weight:bold;font-size:10px;background:#25D366;color:#fff}.footer{margin-top:35px;background:#222;color:#fff;text-align:center;padding:14px;font-size:10px}@media(max-width:900px){.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.products{grid-template-columns:repeat(2,1fr)}.header h1{font-size:22px}}
</style></head>
<body>
<header class="header"><h1>2027 CALENDARS & DIARY</h1><p>Individual Catalogue – Ganesh Printers</p></header>
<main class="container"><div class="back"><a href="index.html">← Back to Home</a></div><div id="catalogue"><div class="loading">Loading catalogue...</div></div></main>
<footer class="footer">Ganesh Printers · 2027 Calendars & Diary<br>Custom Design & Printing Available</footer>
<script>
const REPO="https://api.github.com/repos/futuradigitaltraders-creator/ganesh_printers_landing_page/contents/";
const RAW="https://raw.githubusercontent.com/futuradigitaltraders-creator/ganesh_printers_landing_page/main/";
const WA="919488917786", EXT=/\.(jpg|jpeg|png|webp|gif)$/i;
function title(n){return decodeURIComponent(n).replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim()}
function natural(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'})}
async function contents(path){let r=await fetch(REPO+path+'?ref=main',{cache:'no-store'});if(!r.ok)throw Error('GitHub folder could not be loaded');return r.json()}
async function scan(path){let items=await contents(path),images=[],dirs=[];for(let x of items.sort(natural)){if(x.type==='file'&&EXT.test(x.name))images.push(x);else if(x.type==='dir')dirs.push(x)}return{images,dirs}}
async function build(){let root=await scan('images'),sections=[];if(root.images.length)sections.push({name:'General Collection',images:root.images});for(let d of root.dirs.sort(natural)){let s=await scan(d.path);if(s.images.length)sections.push({name:title(d.name),images:s.images})}let num=0,box=document.getElementById('catalogue');if(!sections.length){box.innerHTML='<div class="error">No catalogue images found.</div>';return}box.innerHTML=sections.map(s=>`<section><h2 class="category">${s.name}</h2><div class="products">${s.images.map(x=>{num++;let t=title(x.name),url=RAW+x.path.replace(/^/,'');return `<article class="product"><img src="${url}" alt="${t}" loading="lazy" onclick="window.open(this.src,'_blank')"><div class="product-content"><div class="product-number">PRODUCT ${String(num).padStart(2,'0')}</div><h3>${t}</h3><div class="dimension" data-image="${url}">Detecting image size...</div><a class="btn" href="https://wa.me/${WA}?text=${encodeURIComponent('Enquiry for '+t)}" target="_blank">WhatsApp Enquiry</a></div></article>`}).join('')}</div></section>`).join('');document.querySelectorAll('.dimension').forEach(e=>{let i=new Image();i.onload=()=>e.textContent=`Image Size: ${i.naturalWidth} × ${i.naturalHeight} px`;i.onerror=()=>e.textContent='';i.src=e.dataset.image})}
build().catch(e=>{document.getElementById('catalogue').innerHTML='<div class="error">Catalogue loading failed. Please refresh the page.</div>';console.error(e)})
</script></body></html>
