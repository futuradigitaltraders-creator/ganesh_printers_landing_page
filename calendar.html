<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 Calendars & Diary</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f6f6;color:#222}
.wrap{max-width:1200px;margin:auto;padding:24px}
.title{text-align:center;margin:0 0 24px;font-size:30px}
.section{background:#fff;margin:0 0 30px;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}
.section h2{margin:0 0 18px;text-align:center;text-transform:uppercase;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff}
.card img{width:100%;height:auto;display:block;background:#eee}
.info{padding:12px}
.name{font-weight:700;word-break:break-word}
.size{font-size:13px;color:#666;margin:6px 0}
.wa{display:inline-block;text-decoration:none;background:#25D366;color:#fff;padding:9px 13px;border-radius:7px;font-weight:700}
.empty{text-align:center;color:#777;padding:30px}
.loading{text-align:center;padding:40px;font-size:18px}
</style>
</head>

<body>

<div class="wrap">
<h1 class="title">2027 Calendars &amp; Diary</h1>
<div id="catalogue" class="loading">Loading catalogue...</div>
</div>

<script>

const REPO='https://api.github.com/repos/futuradigitaltraders-creator/ganesh_printers_landing_page/contents/';
const RAW='https://raw.githubusercontent.com/futuradigitaltraders-creator/ganesh_printers_landing_page/main/';
const WA='919488917786';

const EXT=/\.(jpg|jpeg|png|webp|gif)$/i;

function natural(a,b){
return a.name.localeCompare(b.name,undefined,{
numeric:true,
sensitivity:'base'
});
}

function title(n){
return n
.replace(/[-_]+/g,' ')
.replace(/\.[^.]+$/,'')
.replace(/\b\w/g,c=>c.toUpperCase());
}

async function contents(path){
const r=await fetch(REPO+path+'?ref=main',{cache:'no-store'});
if(!r.ok)throw new Error('GitHub API error '+r.status);
return r.json();
}

async function scan(path){
const items=await contents(path);
const images=[];
const dirs=[];

for(const x of items.sort(natural)){
if(x.type==='file'&&EXT.test(x.name)){
images.push(x);
}
else if(x.type==='dir'&&x.name!=='.gitkeep'){
dirs.push(x);
}
}

return{images,dirs};
}

function addSection(container,name,images){

if(!images.length)return;

const sec=document.createElement('section');
sec.className='section';

sec.innerHTML=
'<h2>'+name+'</h2><div class="grid"></div>';

const grid=sec.querySelector('.grid');

for(const x of images){

const card=document.createElement('div');
card.className='card';

const img=document.createElement('img');
img.src=RAW+x.path.replace(/^\//,'');
img.alt=x.name;
img.loading='lazy';

const info=document.createElement('div');
info.className='info';

const nm=document.createElement('div');
nm.className='name';
nm.textContent=x.name;

const sz=document.createElement('div');
sz.className='size';
sz.textContent='Detecting image size...';

img.onload=()=>{
sz.textContent=
img.naturalWidth+' × '+img.naturalHeight+' px';
};

const wa=document.createElement('a');

wa.className='wa';
wa.target='_blank';
wa.rel='noopener';

wa.href=
'https://wa.me/'+WA+
'?text='+encodeURIComponent(
'Hi, I am interested in '+x.name
);

wa.textContent='Enquire on WhatsApp';

info.append(nm,sz,wa);
card.append(img,info);
grid.append(card);

}

container.append(sec);
}

async function build(){

const out=document.getElementById('catalogue');

try{

const root=await scan('images');

let all=[];

/* FOLDERS FIRST */

for(const d of root.dirs.sort(natural)){

const s=await scan(d.path);

if(s.images.length){

addSection(
out,
title(d.name),
s.images
);

all.push(...s.images);

}

}

/* ROOT IMAGES LAST */

if(root.images.length){

addSection(
out,
'General Collection',
root.images
);

}

if(!all.length&&!root.images.length){

out.innerHTML=
'<div class="empty">No calendar images found in the images folder.</div>';

}

}
catch(e){

out.innerHTML=
'<div class="empty">Unable to load catalogue. Please try again later.</div>';

console.error(e);

}

}

build();

</script>

</body>
</html>
