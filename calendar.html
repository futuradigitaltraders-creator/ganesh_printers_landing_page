<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 Calendars & Diary</title><style>body{margin:0;font-family:Arial;background:#f6f6f6}header{text-align:center;background:#111;color:white;padding:35px 15px}main{max-width:1200px;margin:25px auto;padding:0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 15px #0002}.pic{background:#eee;min-height:300px;display:flex;align-items:center;justify-content:center;padding:12px}.pic img{max-width:100%;max-height:520px;width:auto;height:auto;object-fit:contain}.info{padding:16px}.title{font-size:19px;font-weight:bold;margin:0 0 12px}.btn{background:#168b45;color:white;text-decoration:none;padding:10px 14px;border-radius:7px;display:inline-block}</style></head><body><header><h1>2027 CALENDARS & DIARY</h1><p>Individual Catalogue</p></header><main><div id="catalogue" class="grid"></div></main><script src="image-list.js"></script><script>const root=document.getElementById('catalogue');function title(n){return n.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\b(\d+)\s*x\s*(\d+)\b/gi,'$1×$2').replace(/\b\w/g,c=>c.toUpperCase())}window.CATALOGUE_IMAGES.forEach(f=>{let t=title(f),c=document.createElement('article');c.className='card';c.innerHTML='<div class="pic"><img src="images/'+encodeURIComponent(f)+'" loading="lazy" alt="'+t+'"></div><div class="info"><div class="title">'+t+'</div><a class="btn" target="_blank" href="https://wa.me/919488917786?text='+encodeURIComponent('Hello Ganesh Printers, I am interested in: '+t)+'">WhatsApp Enquiry</a></div>';root.appendChild(c)})</script></main></body></html>
